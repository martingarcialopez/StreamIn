name: Claude Code

on:
  # `edited` too: adding @claude to an existing comment wakes Claude. The `if`
  # below ignores edits to comments that already mentioned it, so fixing a
  # typo doesn't start a second run.
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # One run at a time per issue or PR; a second trigger waits instead of
    # racing. On the job, not the workflow, so events that fail the `if` below
    # (like claude[bot]'s own progress comment) end at once instead of queueing.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Only the repository owner can summon Claude, so a stray @claude can't
    # spend the subscription's usage. The `claude` label hands an issue to
    # claude[bot] to implement; @claude anywhere asks it for help, except
    # "@claude review" on a PR, which claude-code-review.yml handles. On an
    # edit, `changes.body.from` is the previous text: it must not have had
    # @claude yet (on a new comment it's empty).
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review') && !contains(github.event.changes.body.from, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.changes.body.from, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude

          # Lets Claude read CI results (the "Build and test" job) on PRs.
          additional_permissions: |
            actions: read

          # Claude follows the instructions in the comment or issue that
          # triggered it, plus CLAUDE.md. These lines cover what's specific to
          # running here. `gh pr create` / `gh pr edit` let it open the PR for an
          # issue itself, with its description, instead of posting a link.
          # `show_full_output` stays off: on a public repo it would print every
          # tool result in public logs. The bot names blocked commands instead.
          # Options: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --allowedTools "Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh issue view:*)"
            --append-system-prompt "You are claude[bot], running in GitHub Actions on Linux. Xcode isn't available, so you can't build or test this iOS app; the CI workflow (job 'Build and test', a macOS runner) builds the app and runs every package's tests on each push to a pull request. CI only starts after you push, so you can never wait for it inside a run. Don't ask Martín to verify builds or tests locally: say CI will verify the push, and when CI has run, quote its result and link. If asked about a failing run, read its logs with the CI tools, fix the cause and push. Follow CLAUDE.md and the rules in .claude/rules/. Commit messages follow .claude/skills/commit/SKILL.md (gitmoji Conventional Commits title, at most two short body lines, the co-author trailer), without asking for confirmation. Never push to main. When implementing an issue, finish all of it in this run: if it has several steps, make one commit per step, and if a step says to wait for CI or for an earlier step to be green, do it anyway and say in the PR that CI checks every commit. Then push and open the pull request with gh pr create --base main --title '<commit-format title>' --body '<description>': write the description inline in the --body argument (no heredocs, no command substitution, no temporary files), following .github/pull_request_template.md, with 'Closes #<issue number>' and the CI box left unticked. To change it later use gh pr edit <number> --body '<description>'. Then reply on the issue with the PR link. If a command you need is denied, say in your reply exactly which command it was, so the allow-list can be fixed."
