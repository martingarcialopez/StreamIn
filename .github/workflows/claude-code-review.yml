name: Claude Code Review

# The project's own review on every PR: Claude follows
# .claude/agents/ios-reviewer.md (CLAUDE.md, the rules, the swiftui-pro skill)
# on the diff, and its findings are posted on the PR, inline on each line plus
# one summary comment. A clean run still posts its summary, so you can see it
# ran.
#
# No subagent here: the Agent tool runs subagents in the background, so a CI
# run would end its turn waiting for the reviewer and the job would finish
# before the review existed (what happened on #53). Claude does the review
# itself.
#
# Sonnet, not Opus like the local subagent: on PRs Claude opens, this is the
# second review (the first ran in /ship-phase). On the planted-bug PR #53,
# Sonnet found all five problems in 30 s for $0.15 (Opus: 53 s, $0.42). Left
# alone it skipped the rulebooks, so the prompt requires them and the summary
# lists what was read ("Checked against:").
#
# Once per PR, when it's opened or ready, not on every push, so commits that
# address the findings don't each repost them. Comment "@claude review" on the
# PR to review it again, or edit a comment to add it (claude.yml leaves those
# comments to this workflow).
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created, edited]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # PRs: every non-draft PR, claude[bot]'s included. Comments: only Martín's
    # "@claude review" on a PR, so a stray comment can't spend the usage.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       contains(github.event.comment.body, '@claude review') &&
       !contains(github.event.changes.body.from, '@claude review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      # A comment event checks out main by default; review the PR's own code.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Run ios-reviewer and post its findings
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude[bot]'s PRs are reviewed too. The action refuses bot-started
          # runs unless the bot is listed; claude[bot] only acts when Martín
          # triggers it, so this starts nothing on its own.
          allowed_bots: 'claude[bot]'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request with the project's reviewer and post its findings on the PR.

            1. Read .claude/agents/ios-reviewer.md and do that review yourself on pull request #${{ github.event.pull_request.number || github.event.issue.number }}, following every step of it: read the rule files and the swiftui-pro files its "Gather context" step lists for this change, and the full changed files, not only the diff. Don't start a subagent: in this environment it would run in the background and this run would end before it reports. This is GitHub Actions and the checkout is shallow, so get the diff with `gh pr diff`. Finish the whole review before step 2.
            2. For each finding whose `path:line` falls inside the PR's diff, post one inline comment on that line with mcp__github_inline_comment__create_inline_comment. Start the body with the severity in bold, then the problem, the failure scenario, the suggested fix, and the source if the finding has one. A finding that doesn't map to a diff line goes only in the summary.
            3. Post exactly one summary comment with gh pr comment <PR number> --body '<text>', writing the text inline in the --body argument (no heredocs, no command substitution, no temporary files). Format:
               - First line: `### ios-reviewer`
               - Counts by severity, e.g. `0 critical · 1 high · 2 medium · 0 low`
               - One line per finding: severity, `path:line`, the problem in one sentence
               - The reviewer's verdict line (**Ready for PR** or **Fix before PR**)
               - If nothing survived verification: "No findings." and the verdict
               - Last line: `Checked against:` and every rule file and swiftui-pro file you actually read in this run
            Post only findings that survived the reviewer's own verification step, and don't change any code.
          # Sonnet (see above). Read-only tools for the review, plus the two
          # ways to post; no Agent tool (see above).
          # Options: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --model sonnet
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(grep:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
