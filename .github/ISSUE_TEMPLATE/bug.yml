name: Bug
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search "Inception"
        2. Open Details with airplane mode on
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Screenshots welcome.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Device or simulator, iOS version, region and language.
      placeholder: iPhone 17 simulator, iOS 26.5, Spain, Español
